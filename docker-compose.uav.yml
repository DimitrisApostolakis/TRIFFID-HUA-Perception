services:
  uav_perception:
    build:
      context: .
      dockerfile: Dockerfile.uav
    image: triffid_uav_perception:latest
    container_name: triffid_uav_perception

    # GPU access, remove this block if no GPU is available.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ./src/triffid_uav_perception:/app/src/triffid_uav_perception  # source (editable)
      - ./uav_data:/app/uav_data                                      # additional input media
      - ./uav_videos:/app/videos                                      # input videos
      - ./uav_samples:/app/samples                                    # output JSON + selected frames
      - ./uav_models:/app/models                                     # official SANSA checkout + weights
      - ./uav_supports:/app/supports:ro                               # support manifest + images/masks

    ipc: host

    environment:
      - PYTHONPATH=/app/src/triffid_uav_perception
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    stdin_open: true
    tty: true
