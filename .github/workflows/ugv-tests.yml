name: UGV modular pipeline
on:
  push:
    paths: ['src/triffid_ugv_perception/**', '.github/workflows/ugv-tests.yml', 'Dockerfile', 'docker-compose.yml']
  pull_request:
    paths: ['src/triffid_ugv_perception/**', '.github/workflows/ugv-tests.yml', 'Dockerfile', 'docker-compose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ugv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-test dependencies
        run: |
          python -m pip install pytest -r src/triffid_ugv_perception/requirements.txt
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check preserved algorithms, banks, adapters and ROS transport doubles
        run: python -m pytest -q src/triffid_ugv_perception/tests
      - name: Compile node and launch entry points
        run: python -m compileall -q src/triffid_ugv_perception
